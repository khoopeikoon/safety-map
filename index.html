<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f5c">
  <title>SafeWalk</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Map"></div>

  <section id="panel" class="panel">
    <div class="handle" aria-hidden="true"></div>
    <form id="route-form" autocomplete="off">
      <div class="field">
        <span class="dot dot-start" aria-hidden="true"></span>
        <input id="from" type="search" placeholder="Start: search, or tap the map" aria-label="Start">
        <button type="button" id="locate" class="icon-btn" title="Use my location" aria-label="Use my location">◎</button>
      </div>
      <ul id="from-results" class="results" hidden></ul>
      <div class="field">
        <span class="dot dot-end" aria-hidden="true"></span>
        <input id="to" type="search" placeholder="Destination: search, or tap the map" aria-label="Destination">
        <button type="button" id="swap" class="icon-btn" title="Swap start and destination" aria-label="Swap">⇅</button>
      </div>
      <ul id="to-results" class="results" hidden></ul>
      <div class="actions">
        <button type="button" id="clear" class="secondary">Clear</button>
      </div>
    </form>

    <div class="crime">
      <label><input type="checkbox" id="crime-toggle" checked> NYPD reports, last 90 days</label>
      <div class="legend" aria-hidden="true">
        <span><i style="background:#d64545"></i>Felony</span>
        <span><i style="background:#e8902a"></i>Misdemeanor</span>
        <span><i style="background:#c9b02b"></i>Violation</span>
      </div>
      <div class="legend-age" aria-hidden="true">Faded dots are older. Smaller dots are where more people live.</div>
      <label class="sub"><input type="checkbox" id="crime-indoor"> Include indoor reports</label>
      <div id="crime-note" class="crime-note" aria-live="polite"></div>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div id="summary" class="summary" hidden>
      <div><strong id="sum-time"></strong> <span id="sum-dist"></span></div>
      <button type="button" id="toggle-steps" class="link-btn">Show steps</button>
    </div>
    <a id="apple-maps" class="apple-btn" href="#" target="_blank" rel="noopener" hidden>Open in Apple Maps</a>
    <ol id="steps" class="steps" hidden></ol>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="crime.js"></script>
  <script src="app.js"></script>
</body>
</html>
